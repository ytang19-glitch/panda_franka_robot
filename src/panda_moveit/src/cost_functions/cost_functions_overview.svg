<g transform="translate(574 142)"><rect width="230" height="136" rx="8" fill="#f1f5f9"/><text x="12" y="20" font-size="14" font-weight="bold">Joint deviation</text><text x="12" y="39" font-size="12">Jq = weighted squared error</text><g transform="translate(17 40) scale(1.35 .85)"><path d="M12 8 V84 H140" stroke="#94a3b8" fill="none"/><path d="M12 18 Q65 150 118 18" fill="none" stroke="#147d83" stroke-width="2.5"/></g><text x="115" y="126" text-anchor="middle" font-size="11">joint deviation</text></g><g transform="translate(822 142)"><rect width="230" height="136" rx="8" fill="#f1f5f9"/><text x="12" y="20" font-size="14" font-weight="bold">Singularity</text><text x="12" y="39" font-size="12">Js = 1 / (σmin² + ε)</text><g transform="translate(17 40) scale(1.35 .85)"><path d="M12 8 V84 H140" stroke="#94a3b8" fill="none"/><path d="M12 18 C20 60 42 77 118 82" fill="none" stroke="#147d83" stroke-width="2.5"/></g><text x="115" y="126" text-anchor="middle" font-size="11">σmin</text></g><g transform="translate(574 288)"><rect width="230" height="136" rx="8" fill="#f1f5f9"/><text x="12" y="20" font-size="14" font-weight="bold">Collision clearance</text><text x="12" y="39" font-size="12">Jc = max(0, dsafe − d)²</text><g transform="translate(17 40) scale(1.35 .85)"><path d="M12 8 V84 H140" stroke="#94a3b8" fill="none"/><path d="M12 18 Q50 84 75 84 L118 84" fill="none" stroke="#147d83" stroke-width="2.5"/></g><text x="115" y="126" text-anchor="middle" font-size="11">clearance d</text></g><g transform="translate(822 288)"><rect width="230" height="136" rx="8" fill="#f1f5f9"/><text x="12" y="20" font-size="14" font-weight="bold">Path smoothness</text><text x="12" y="39" font-size="12">Jsm = squared second differences</text><g transform="translate(17 40) scale(1.35 .85)"><path d="M12 8 V84 H140" stroke="#94a3b8" fill="none"/><path d="M12 70 L35 25 L60 70 L84 25 L118 70" fill="none" stroke="#e18b79" stroke-width="2.5"/><path d="M12 70 L118 25" stroke="#147d83" stroke-width="2.5" fill="none"/></g><text x="115" y="126" text-anchor="middle" font-size="11">waypoint index</text></g>
