<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Why the controller and solver use two SPSC queues</title>
  <desc id="desc">Top path: the controller produces robot states, the state queue carries them to the solver, and the solver consumes them. Bottom path: the solver produces torque commands, the torque queue carries them back to the controller, and the controller consumes them. Each queue has exactly one producer and one consumer.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309"/></marker>
  </defs>
  <rect width="1000" height="400" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="500" y="34" font-size="25" font-weight="700" fill="#0f172a">Two SPSC queues = two one-way data paths</text>
    <text x="500" y="61" font-size="17" fill="#475569">The producer and consumer roles reverse on the return path.</text>
    <rect x="35" y="85" width="260" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="705" y="85" width="260" height="250" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="165" y="116" font-size="21" font-weight="700" fill="#0f172a">Controller update()</text>
    <text x="835" y="116" font-size="21" font-weight="700" fill="#0f172a">Solver worker</text>
    <text x="165" y="155" font-size="19" fill="#1d4ed8">Writes robot state</text>
    <text x="165" y="180" font-size="17" font-weight="700" fill="#1d4ed8">Producer</text>
    <text x="835" y="155" font-size="19" fill="#1d4ed8">Reads robot state</text>
    <text x="835" y="180" font-size="17" font-weight="700" fill="#1d4ed8">Consumer</text>
    <line x1="55" y1="214" x2="275" y2="214" stroke="#cbd5e1"/>
    <line x1="725" y1="214" x2="945" y2="214" stroke="#cbd5e1"/>
    <text x="165" y="277" font-size="19" fill="#92400e">Reads torque command</text>
    <text x="165" y="302" font-size="17" font-weight="700" fill="#92400e">Consumer</text>
    <text x="835" y="277" font-size="19" fill="#92400e">Writes torque command</text>
    <text x="835" y="302" font-size="17" font-weight="700" fill="#92400e">Producer</text>
    <rect x="390" y="125" width="220" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="153" font-size="20" font-weight="700" fill="#1e40af">State queue</text>
    <text x="500" y="179" font-size="17" fill="#1e40af">q, dq</text>
    <rect x="390" y="245" width="220" height="70" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <text x="500" y="273" font-size="20" font-weight="700" fill="#92400e">Torque queue</text>
    <text x="500" y="299" font-size="17" fill="#92400e">tau</text>
    <line x1="299" y1="160" x2="384" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <line x1="614" y1="160" x2="699" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <line x1="701" y1="280" x2="616" y2="280" stroke="#b45309" stroke-width="3" marker-end="url(#orange-arrow)"/>
    <line x1="386" y1="280" x2="301" y2="280" stroke="#b45309" stroke-width="3" marker-end="url(#orange-arrow)"/>
    <text x="500" y="372" font-size="18" fill="#334155">Each queue: one producer (push) + one consumer (pop).</text>
  </g>
</svg>
